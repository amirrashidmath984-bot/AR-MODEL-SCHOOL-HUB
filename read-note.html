<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>AS MODEL • Read Note</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --primary:#2563eb;
    --secondary:#7c3aed;
    --dark:#0f172a;
    --text:#334155;
    --muted:#64748b;
    --bg:#f1f5f9;
    --white:#fff;
    --border:#e2e8f0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--dark);
}


/* =========================
   HEADER
========================= */

.header{

    position:sticky;
    top:0;

    z-index:1000;

    height:68px;

    padding:0 5%;

    display:flex;

    align-items:center;

    justify-content:space-between;

    background:rgba(255,255,255,.95);

    backdrop-filter:blur(14px);

    border-bottom:1px solid var(--border);
}

.brand{

    display:flex;

    align-items:center;

    gap:10px;
}

.logo{

    width:42px;
    height:42px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:12px;

    color:white;

    font-weight:900;

    background:
    linear-gradient(
        135deg,
        var(--primary),
        var(--secondary)
    );
}

.brand h2{
    font-size:15px;
}

.brand span{

    display:block;

    margin-top:3px;

    color:var(--muted);

    font-size:9px;
}

.headerButtons{

    display:flex;

    gap:7px;
}

.btn{

    border:0;

    border-radius:9px;

    padding:10px 13px;

    cursor:pointer;

    font-size:10px;

    font-weight:bold;
}

.backBtn{

    background:#e2e8f0;

    color:var(--dark);
}

.copyBtn{

    color:white;

    background:
    linear-gradient(
        135deg,
        var(--primary),
        var(--secondary)
    );
}


/* =========================
   MAIN
========================= */

.container{

    width:92%;

    max-width:900px;

    margin:35px auto 70px;
}


/* =========================
   NOTE
========================= */

.note{

    background:white;

    border:1px solid var(--border);

    border-radius:22px;

    overflow:hidden;

    box-shadow:
    0 15px 40px rgba(15,23,42,.06);
}

.noteTop{

    padding:30px;

    border-bottom:1px solid var(--border);
}

.subject{

    display:inline-block;

    padding:6px 10px;

    margin-bottom:12px;

    border-radius:20px;

    background:#eff6ff;

    color:var(--primary);

    font-size:9px;

    font-weight:bold;
}

.noteTop h1{

    font-size:30px;

    line-height:1.25;

    margin-bottom:10px;
}

.description{

    color:var(--muted);

    font-size:11px;

    line-height:1.7;
}

.noteContent{

    padding:30px;

    color:var(--text);

    font-size:14px;

    line-height:1.9;

    white-space:pre-wrap;

    overflow-wrap:anywhere;
}

.noteContent h1,
.noteContent h2,
.noteContent h3{

    color:var(--dark);

    margin-top:20px;

    margin-bottom:10px;
}

.noteContent p{

    margin-bottom:15px;
}

.noteBottom{

    padding:20px 30px;

    border-top:1px solid var(--border);

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;

    flex-wrap:wrap;
}

.noteBottom span{

    color:var(--muted);

    font-size:9px;
}


/* =========================
   EMPTY
========================= */

.empty{

    background:white;

    border:1px solid var(--border);

    border-radius:20px;

    padding:60px 20px;

    text-align:center;
}

.emptyIcon{

    font-size:45px;

    margin-bottom:15px;
}

.empty h2{

    font-size:20px;

    margin-bottom:8px;
}

.empty p{

    color:var(--muted);

    font-size:10px;

    line-height:1.7;

    margin-bottom:20px;
}


/* =========================
   TOAST
========================= */

.toast{

    position:fixed;

    left:50%;

    bottom:25px;

    transform:
    translate(-50%,20px);

    opacity:0;

    pointer-events:none;

    padding:11px 16px;

    border-radius:10px;

    color:white;

    background:#0f172a;

    font-size:10px;

    transition:.3s;

    z-index:9999;
}

.toast.show{

    opacity:1;

    transform:
    translate(-50%,0);
}


/* =========================
   PRINT
========================= */

@media print{

    .header,
    .headerButtons,
    .noteBottom,
    .toast{

        display:none !important;
    }

    body{

        background:white;
    }

    .container{

        width:100%;

        max-width:none;

        margin:0;
    }

    .note{

        border:0;

        box-shadow:none;
    }

    .noteTop,
    .noteContent{

        padding:15px;
    }

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .header{

        padding:0 4%;
    }

    .brand h2{

        font-size:13px;
    }

    .brand span{

        display:none;
    }

    .container{

        width:94%;

        margin-top:20px;
    }

    .noteTop{

        padding:22px;
    }

    .noteTop h1{

        font-size:24px;
    }

    .noteContent{

        padding:22px;

        font-size:13px;
    }

    .noteBottom{

        padding:18px 22px;
    }

    .copyBtn{

        display:none;
    }

}

</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="brand">

        <div class="logo">
            AS
        </div>

        <div>

            <h2>
                AS MODEL
            </h2>

            <span>
                Digital Study Notes
            </span>

        </div>

    </div>


    <div class="headerButtons">

        <button
            class="btn copyBtn"
            onclick="copyNote()"
        >
            📋 Copy
        </button>

        <button
            class="btn backBtn"
            onclick="goBack()"
        >
            ← Back
        </button>

    </div>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="container">

    <div id="noteArea"></div>

</main>


<!-- =========================
     TOAST
========================= -->

<div
    class="toast"
    id="toast"
>
    Copied successfully!
</div>


<script>


/* =========================
   GET CURRENT NOTE
========================= */

const savedNote =
    localStorage.getItem(
        "AS_MODEL_CURRENT_NOTE"
    );


let note = null;


try{

    note =
        savedNote
        ? JSON.parse(savedNote)
        : null;

}catch(error){

    note = null;

}


/* =========================
   DISPLAY NOTE
========================= */

function renderNote(){

    const area =
        document.getElementById(
            "noteArea"
        );


    if(!note){

        area.innerHTML = `

            <div class="empty">

                <div class="emptyIcon">
                    📭
                </div>

                <h2>
                    No Note Selected
                </h2>

                <p>
                    Please return to the Notes page
                    and select a study note.
                </p>

                <button
                    class="btn copyBtn"
                    onclick="location.href='notes.html'"
                >
                    📚 Go To Notes
                </button>

            </div>

        `;

        return;

    }


    area.innerHTML = `

        <article class="note">

            <div class="noteTop">

                <span class="subject">

                    ${escapeHTML(
                        note.subject || "General"
                    )}

                </span>


                <h1>

                    ${escapeHTML(
                        note.title || "Untitled Note"
                    )}

                </h1>


                <p class="description">

                    ${escapeHTML(
                        note.description || ""
                    )}

                </p>

            </div>


            <div
                class="noteContent"
                id="noteContent"
            >

                ${formatContent(
                    note.content || "No content available."
                )}

            </div>


            <div class="noteBottom">

                <span>
                    📚 AS MODEL Study System
                </span>


                <div class="headerButtons">

                    <button
                        class="btn copyBtn"
                        onclick="copyNote()"
                    >
                        📋 Copy Note
                    </button>


                    <button
                        class="btn backBtn"
                        onclick="window.print()"
                    >
                        🖨️ Print / PDF
                    </button>

                </div>

            </div>

        </article>

    `;

}


/* =========================
   FORMAT CONTENT
========================= */

function formatContent(text){

    /*
       Developer irraa content plain text
       taanaan line breaks eega.
    */

    return escapeHTML(text)
        .replace(/\n/g,"<br>");

}


/* =========================
   COPY NOTE
========================= */

async function copyNote(){

    if(!note){

        return;

    }


    const text =

        (note.title || "") +

        "\n\n" +

        (note.content || "");


    try{

        await navigator.clipboard.writeText(
            text
        );

        showToast(
            "✅ Note copied successfully!"
        );

    }catch(error){

        fallbackCopy(text);

    }

}


/* =========================
   FALLBACK COPY
========================= */

function fallbackCopy(text){

    const area =
        document.createElement(
            "textarea"
        );

    area.value = text;

    document.body.appendChild(area);

    area.select();

    document.execCommand("copy");

    area.remove();

    showToast(
        "✅ Note copied successfully!"
    );

}


/* =========================
   TOAST
========================= */

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    setTimeout(
        function(){

            toast.classList.remove(
                "show"
            );

        },
        2200
    );

}


/* =========================
   BACK
========================= */

function goBack(){

    if(
        document.referrer &&
        document.referrer.includes(
            "notes.html"
        )
    ){

        history.back();

    }else{

        location.href =
            "notes.html";

    }

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text){

    return String(text)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/* =========================
   START
========================= */

renderNote();

</script>

</body>
</html>
